{{define "login"}}<!doctype html>
<html lang="zh">
{{template "head" .}}
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="login">登录</h1>
    <p class="sub" data-i18n="login_sub">ServerAgentLink · 服务器接线台</p>
    <form id="login" class="form">
      <label><span data-i18n="username">用户名</span><input name="username" placeholder="admin" autocomplete="username"></label>
      <label><span data-i18n="password">密码</span><input name="password" type="password" placeholder="密码" autocomplete="current-password" data-i18n-placeholder="password"></label>
      <div class="form-actions"><button type="submit" class="btn btn-primary" style="width:100%" data-i18n="login">登录</button></div>
      <p class="hint" id="login-msg" style="margin:10px 0 0;font-size:12px;color:var(--danger);display:none" data-i18n="login_failed">用户名或密码错误</p>
    </form>
  </div>
</div>
<script>
document.getElementById('login').addEventListener('submit', function (e) {
  e.preventDefault();
  var fd = new FormData(e.target);
  var msg = document.getElementById('login-msg');
  msg.style.display = 'none';
  salFetch('POST', '/api/login', { username: fd.get('username'), password: fd.get('password') })
    .then(function () { location.href = '/'; })
    .catch(function () { msg.style.display = 'block'; });
});
</script>
</body>
</html>{{end}}
